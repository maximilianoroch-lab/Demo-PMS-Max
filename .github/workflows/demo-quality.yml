name: DEMO quality gate
on:
  push:
    branches: [main, enterprise-executive-ui]
  pull_request:
  workflow_dispatch:
jobs:
  simulation-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate application Python syntax
        run: python -m compileall -q app.py advisor.py demo_trade.py demo_independent_model.py
      - name: Test simulator funding and accounting
        run: python -m unittest discover -s tests -p 'test_demo_trade.py' -v
