name: DEMO daily snapshot
on:
  schedule:
    - cron: '25 23 * * *'
  workflow_dispatch:
  push:
    paths: ['demo_history.py', '.github/workflows/demo-daily-snapshot.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Record independent V5 snapshot
        run: python demo_history.py
      - name: Save updated observations
        run: |
          git config user.name "pms-demo-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo_daily_snapshots.csv data/demo_daily_assets.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record daily independent DEMO V5 snapshot"
            git push
          fi
